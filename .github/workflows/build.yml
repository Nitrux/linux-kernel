name: Build and push packages to PackageCloud.

on:
  push:
    branches:
      - 'linux-nitrux'
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: debian:testing
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install PackageCloud client
        run: apt -q update && apt -yy install ruby-full ca-certificates && gem install package_cloud

      - name: Build kernel and package set
        run: ./gh-build.sh

      - name: Push packages
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: package_cloud push nitrux/testing/debian/duke output/*.deb
