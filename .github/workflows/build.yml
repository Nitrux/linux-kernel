name: Build and push packages to PackageCloud.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (use self-hosted or a larger runner when available)
        required: true
        default: ubuntu-24.04
        type: string
      lto:
        description: Link-time optimization mode
        required: true
        default: none
        type: choice
        options:
          - none
          - thin
          - full
      publish:
        description: Push the resulting packages to PackageCloud
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-amd64:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    container:
      image: debian:testing-20260713-slim
      env:
        DEBIAN_FRONTEND: noninteractive
        KERNEL_LTO: ${{ inputs.lto }}
        KERNEL_DEBUG_COMPRESSION: zstd
        PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - name: Install CA certificates
        run: apt update && apt install --no-install-recommends -y ca-certificates

      - name: Update APT sources and upgrade
        run: |
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10-no-check-valid-until
          echo 'Acquire::Check-Date "false";' >> /etc/apt/apt.conf.d/10-no-check-valid-until
          cat <<EOF > /etc/apt/sources.list.d/debian.sources
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261105T143010Z
          Suites: testing
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Architectures: amd64
          EOF
          apt update && apt full-upgrade -y

      - name: Setup amd64 environment
        run: apt install --no-install-recommends -y build-essential devscripts equivs git gnupg lintian ruby-full sudo

      - name: Install PackageCloud client
        if: ${{ inputs.publish }}
        run: gem install --no-document package_cloud

      - uses: actions/checkout@v4

      - name: Cache upstream source archive
        uses: actions/cache@v4
        with:
          path: cache
          key: kernel-source-${{ hashFiles('VERSION') }}

      - name: Materialize Secure Boot signing credentials
        env:
          SECURE_BOOT_KEY_CONTENT: ${{ secrets.SECURE_BOOT_KEY }}
          SECURE_BOOT_CERT_CONTENT: ${{ secrets.SECURE_BOOT_CERT }}
        run: |
          test -n "$SECURE_BOOT_KEY_CONTENT" || { echo "SECURE_BOOT_KEY secret is required" >&2; exit 1; }
          test -n "$SECURE_BOOT_CERT_CONTENT" || { echo "SECURE_BOOT_CERT secret is required" >&2; exit 1; }
          install -d -m 700 /tmp/nitrux-secure-boot
          printf '%s\n' "$SECURE_BOOT_KEY_CONTENT" > /tmp/nitrux-secure-boot/db.key
          printf '%s\n' "$SECURE_BOOT_CERT_CONTENT" > /tmp/nitrux-secure-boot/db.crt
          chmod 600 /tmp/nitrux-secure-boot/db.key
          chmod 644 /tmp/nitrux-secure-boot/db.crt
          echo "SECURE_BOOT_KEY=/tmp/nitrux-secure-boot/db.key" >> "$GITHUB_ENV"
          echo "SECURE_BOOT_CERT=/tmp/nitrux-secure-boot/db.crt" >> "$GITHUB_ENV"

      - name: Build kernel and package set
        run: ./gh-build.sh

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-nitrux-${{ hashFiles('VERSION') }}-amd64
          path: output/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Push packages
        if: ${{ inputs.publish }}
        run: package_cloud push nitrux/testing/debian/duke output/*.deb
